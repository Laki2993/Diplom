        document.getElementById("widget").style.borderRadius = "70px";
        document.getElementById("insideContent").style.display = "none";
        closeCorrect();
        closeSettingWin();
   }
});

function closeSettingWin(){
    setTimeout(function(){
    if(document.getElementById("SettingWindows").style.display = "grid"){
        document.getElementById("SettingWindows").style.display = "none";
        document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        eventElement.style.border = "1px solid #303030";
    });
    }
    },500);
};

document.getElementById("AddEvent").addEventListener("click", function() {
    closeSettingWin(); 
    let Inp = document.createElement("input");
    Inp.className = "EventInput";
    document.getElementById("Events").appendChild(Inp);
    Inp.focus(); 
});



document.addEventListener("keydown", function(event) {
    if(event.shiftKey  &&  event.key === "A" || event.shiftKey  &&  event.key === "Ф" || event.shiftKey  &&  event.keyCode === 32) {
        if(document.querySelector(".EventInput") === null && document.querySelector(".EventInput") !== document.activeElement){
            closeSettingWin(); 
            let Inp = document.createElement("input");
            Inp.className = "EventInput";
            Inp.value = "";
            document.getElementById("Events").appendChild(Inp);
            setTimeout(function(){
                Inp.focus();
            },100);  
        }
    }
});
 
function removeEmptyInputs() {
    let activeInput = document.querySelector('.EventInput');
    return activeInput;
}


function removeEmptyInputs() {
    let activeInput = document.querySelector('.EventInput');
    return activeInput;
}

let isEnterProcessing = false;
document.addEventListener("blur", function(event) {
    if (isEnterProcessing) return;
    
    if (event.target.classList.contains("EventInput") && event.target.value.trim() === "") {
        event.target.remove();
    }
    else if(event.target.classList.contains("EventInput") && event.target.value.trim() !== ""){
        let Remove_Res = removeEmptyInputs();
        if (Remove_Res && Remove_Res.isConnected) { 
            let Event_P = document.createElement("div");
            Event_P.className = "Event_P";
            Event_P.style.border = "1px solid #303030";
            Event_P.innerHTML = Remove_Res.value;
            Remove_Res.value = "";
            Remove_Res.remove();
            
            setTimeout(function() {
                document.getElementById("Events").appendChild(Event_P);
            }, 50);
        }
    }
}, true); 

document.addEventListener("keydown", function(event) {
    let Remove_Res1 = removeEmptyInputs();
    
    if(event.key === "Enter" && Remove_Res1) {
        if (Remove_Res1.value.trim() !== "") {
            isEnterProcessing = true; 
            
            let Event_P = document.createElement("div");
            Event_P.className = "Event_P";
            Event_P.innerHTML = Remove_Res1.value;
            Remove_Res1.value = "";
            
            setTimeout(function() {
                if (Remove_Res1.isConnected) { 
                    Remove_Res1.remove();
                }
                document.getElementById("Events").appendChild(Event_P);
                    setTimeout(() => isEnterProcessing = false, 10);
            }, 50);
        }
    }
});

document.getElementById("delete").addEventListener("click", function(event) {

function serch(){
    let search = null;
    document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        if (eventElement.style.border === "2px solid rgb(67, 111, 255)") {
            search = eventElement;
        }
    });
    return search;
}

function Close_Satting_Win(){
    document.querySelectorAll(".btn_option").forEach(function(eventElement) {
        eventElement.style.display = "none";
        document.getElementById("SettingWindows").style.height = "15px";
        document.getElementById("SettingWindows").style.alignContent = "start";
        document.getElementById("widget").style.width = "800px";
    });
};

function Open_Satting_Win(){
    document.querySelectorAll(".btn_option").forEach(function(eventElement) {
        setTimeout(function(){
            eventElement.style.display = "block";
            document.getElementById("SettingWindows").style.height = "90px";
            document.getElementById("SettingWindows").style.alignContent = "center";
            document.getElementById("widget").style.width = "800px";
        }, 500);
    });
}

document.getElementById("correct").addEventListener("click", function(event) {
    ////////////////////////////////////////////////////////////////////////////////
    Close_Satting_Win();
    document.getElementById("correct").style.display = "block";
    document.getElementById("widget").style.width = "1100px";
    setTimeout(function(){
        document.getElementById("correctConteiner").style.height = "220px";
        document.getElementById("correctConteiner").style.padding = "10px";
        document.getElementById("textCorrect").focus();
    },500);
   serch();    
   if(serch != null){
       const serch_res = serch();  
        document.getElementById("textCorrect").value = serch_res.textContent;
        document.getElementById("correct").classList.add("Correct-Active");
    }
});

function closeCorrect(){
    document.getElementById("correct").classList.remove("Correct-Active"); 
    document.getElementById("textCorrect").value = "";
    document.getElementById("correctConteiner").style.height = "0px";
    document.getElementById("correctConteiner").style.padding = "0px";
};

document.getElementById("Save").addEventListener("click", function(event) {
    document.getElementById("correctConteiner").style.height= "0px";
    document.getElementById("correctConteiner").style.padding = "0px";
       document.querySelectorAll(".Event_P").forEach(function(eventElement) {
        if (eventElement.style.border === "2px solid rgb(67, 111, 255)") {
            eventElement.innerHTML = document.getElementById("textCorrect").value;
            Open_Satting_Win()
            closeCorrect()
            closeSettingWin()
        }
    });
});

document.getElementById("close").addEventListener("click", function(event) {
    Open_Satting_Win()
    closeCorrect();
    closeSettingWin();
});
